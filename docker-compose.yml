version: "3.3"

services:
  math-academy-api:
    container_name: math-academy-api
    restart: always
    image: node:20.19.0
    ports:
      - 4005:4000
    env_file:
      - .env
    volumes:
      - ./:/usr/src/math-academy-api
    working_dir: /usr/src/math-academy-api
    networks:
      - math-academy-network
    command: bash -c "rm -rf dist && npm install --include=dev && npm run build && npm run start:prod"

networks:
  math-academy-network:
    driver: bridge
